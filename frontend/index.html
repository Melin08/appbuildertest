<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D&D 5e Character Sheet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dnd: {
              bg: '#07090e',
              surface: '#0d121d',
              card: '#131b2a',
              input: '#090e17',
              hover: '#1c273c',
              border: '#2a3a54',
              subtle: '#1e293b',
              red: '#ef4444',
              redDark: '#dc2626',
              gold: '#f59e0b',
              emerald: '#10b981',
              blue: '#38bdf8',
              purple: '#c084fc'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Clean custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090e17;
    }
    ::-webkit-scrollbar-thumb {
      background: #2a3a54;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ef4444;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
  </head>
<body class="bg-[#07090e] text-slate-100 min-h-screen selection:bg-red-600 selection:text-white">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.js"></script></body>
</html>
